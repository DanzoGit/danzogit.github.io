<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Заголовок и описание подставляются из документа: сначала front matter
     (title / description в начале md), иначе из первого заголовка первого уровня.
     Значения ниже видны только до загрузки файла. -->
<title>Все возможности бота 7dbot - badrocktv</title>
<meta name="description" content="Что умеет 7dbot на Twitch-канале badrocktv: команды чата, награды за баллы, именные зомби в 7 Days to Die, анонсы и сайт." />

<!-- Превью для Telegram, Discord и поиска собирают роботы, которые не выполняют
     скрипты, поэтому эти строки нужно заполнять вручную под конкретную страницу. -->
<meta property="og:type" content="article" />
<meta property="og:url" content="https://danzogit.github.io/7dbot/" />
<meta property="og:site_name" content="badrocktv" />
<meta property="og:title" content="Все возможности бота 7dbot" />
<meta property="og:description" content="Что умеет 7dbot на Twitch-канале badrocktv: команды чата, награды за баллы, именные зомби в 7 Days to Die, анонсы и сайт." />
<!-- Для превью нужен именно JPEG: тот же баннер в PNG весит 2.2 МБ, и краулеры
     такую картинку часто не забирают вовсе -->
<meta property="og:image" content="https://danzogit.github.io/7dbot/banner.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<!-- Размеры баннера: по ним парсер понимает, что картинка широкая, и показывает
     превью крупным, не дожидаясь ее загрузки -->
<meta property="og:image:width" content="1672" />
<meta property="og:image:height" content="941" />
<meta property="og:image:alt" content="Баннер: возможности бота 7dbot" />
<meta name="twitter:card" content="summary_large_image" />

<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#191c19" />
<link rel="icon" type="image/png" href="/favicon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Подсветка кода: две темы, переключаются вместе с темой страницы -->
<link id="hljs-dark" rel="stylesheet" media="all"
      href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark-dimmed.min.css">
<link id="hljs-light" rel="stylesheet" media="not all"
      href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/csharp.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/xml.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/bash.min.js"></script>

<script>
  // Тема выбирается до отрисовки, иначе на светлой теме мигает темный фон.
  // По умолчанию тема темная: светлая включается только вручную кнопкой
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('md-theme'); } catch (e) {}
    document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
  })();

  // Настройки страницы. Все поля необязательны, значения по умолчанию — в reader.js
  window.MD_READER = {
    md: 'FEATURES.md',            // файл рядом со страницей
    cover: 'banner.jpg',          // баннер над названием
    titleSuffix: ' - badrocktv',  // приписка к заголовку окна браузера
  };
</script>

<link rel="stylesheet" href="/assets/md-reader/reader.css" />
</head>
<body>
  <header class="bar">
    <button id="navToggle" class="btn" type="button" aria-label="Показать разделы" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>

    <div class="moon" id="moon" role="img" aria-label="Прочитано 0 процентов"></div>
    <span class="read-pct" id="readPct">0%</span>
    <span class="bar-sep"></span>
    <span class="bar-title" id="barTitle"></span>

    <div class="bar-actions">
      <div class="find">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
        </svg>
        <input id="find" type="search" placeholder="Найти в документе" autocomplete="off"
               spellcheck="false" aria-label="Найти в документе" />
        <span class="find-count" id="findCount"><kbd>/</kbd></span>
      </div>
      <button id="themeBtn" class="btn" type="button" aria-label="Сменить тему">
        <svg id="iMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
        </svg>
        <svg id="iSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="display:none">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail" aria-label="Разделы документа">
      <div class="rail-head">Разделы <b id="railCount">—</b></div>
      <div class="rail-scroll">
        <ul id="railList"><li><span class="rail-empty">Читаем файл…</span></li></ul>
      </div>
    </nav>

    <main>
      <div class="cover" id="cover" hidden><img id="coverImg" alt="" /></div>

      <header class="doc-head" id="docHead" hidden>
        <div class="eyebrow" id="eyebrow" hidden></div>
        <h1 class="doc-title" id="docTitle"></h1>
        <p class="doc-facts" id="docFacts"></p>
      </header>

      <div id="boot">
        <div class="sk big"></div>
        <div class="sk w90"></div>
        <div class="sk w72"></div>
        <div class="sk box"></div>
        <div class="sk w54"></div>
      </div>

      <article id="article" hidden></article>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>

  <button class="up" id="up" type="button" aria-label="Наверх">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>

  <div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Просмотр изображения">
    <img id="zoomImg" alt="" />
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/md-reader/reader.js" defer></script>
</body>
</html>
